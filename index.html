<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- La entrada de la portada espera escondida a que arranque la animacion.
     Solo si nadie pidio menos movimiento, y con salvavidas: a los tres
     segundos se retira la clase aunque el JavaScript no haya llegado. -->
<script>(function(){
  var r=document.documentElement;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  r.classList.add('vf-entrada');
  setTimeout(function(){r.classList.remove('vf-entrada')},3000);
})()</script>
<!--app-head-->
</head>
<body>
<div id="root"><!--app-html--></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
