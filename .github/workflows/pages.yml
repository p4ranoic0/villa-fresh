name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # No se cancela un despliegue a medias: cancelarlo puede dejar Pages
  # sirviendo un artefacto incompleto. Dos push seguidos se encolan.
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
      - name: Instalar dependencias fijadas
        run: bun install --frozen-lockfile
      - name: Construir el sitio
        run: bun run build
      - name: Ejecutar todas las pruebas
        run: bun test
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: construir
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
