<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#04101d; --panel:#0a1c30; --ink:#eaf2f8; --ink-2:#a6bccd; --dim:#8ba3ba;
    --line:rgba(139,163,186,.22); --line-2:rgba(139,163,186,.42);
    --cyan:#3ec1ff;
    --disp:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;background:var(--ground);color:var(--ink);
       font-family:var(--disp);-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}

  /* marca de agua: motivo gota+montaña, trazo fino, recortado por el borde */
  .motif{position:absolute;right:-150px;top:-70px;width:620px;height:744px;
         fill:none;stroke:var(--cyan);stroke-width:1.1;stroke-linejoin:round;opacity:.15}

  .wrap{position:relative;height:100%;display:grid;grid-template-rows:1fr auto;padding:58px 64px 0}
  .top{display:grid;grid-template-columns:1fr 300px;gap:40px;align-items:stretch}

  .lbl{font-family:var(--mono);font-size:15px;font-weight:500;letter-spacing:.2em;
       text-transform:uppercase;color:var(--cyan)}
  h1{font-weight:800;letter-spacing:-.035em;line-height:.92;text-transform:uppercase;
     font-size:76px;margin-top:26px}

  .datos{display:flex;gap:0;margin-top:40px;border-top:1px solid var(--line-2)}
  .dato{padding:22px 34px 0 0;margin-right:34px;border-right:1px solid var(--line)}
  .dato:last-child{border-right:0;margin-right:0;padding-right:0}
  .dato .k{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.2em;
           text-transform:uppercase;color:var(--dim)}
  .dato .v{font-family:var(--mono);font-size:42px;font-weight:600;letter-spacing:-.03em;
           line-height:1.05;margin-top:10px}
  .dato .v.acento{color:var(--cyan)}
  .dato .v sup{font-size:20px;font-weight:500;vertical-align:super;letter-spacing:0}

  .marca{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-bottom:36px}
  .marca img{width:290px;height:290px;display:block}

  /* banda cian de cierre: la única inversión de valor de la pieza */
  .firma{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.16em;
         text-transform:uppercase;color:var(--dim);text-align:center}
  .cinta{background:var(--cyan);color:var(--ground);margin:0 -64px;padding:20px 64px;
         display:flex;align-items:center;justify-content:space-between;
         font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:.12em;
         text-transform:uppercase}
</style></head>
