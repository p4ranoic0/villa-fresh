  <text x="100" y="213" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="5.6" letter-spacing="1.5" fill="#8ba3ba">AGUA DE MESA</text>
  <text x="100" y="221" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="6" font-weight="600" letter-spacing="1.2" fill="#3ec1ff">CONT. NETO 20 L</text>
