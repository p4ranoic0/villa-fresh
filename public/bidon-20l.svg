  <text x="100" y="27" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="7.5" letter-spacing="1.4" fill="#7fd4ff">SELLADO</text>

  <!-- etiqueta -->
  <rect x="46" y="164" width="108" height="60" fill="#04101d" fill-opacity=".82"/>
  <rect x="46" y="164" width="108" height="60" fill="none" stroke="#3ec1ff" stroke-opacity=".55" stroke-width="1.2"/>
  <g transform="translate(100 182) scale(0.20)" fill="none" stroke="#3ec1ff" stroke-width="6" stroke-linejoin="round">
    <path d="M50 5C50 5 9 52 9 78a41 41 0 0 0 82 0C91 52 50 5 50 5z" transform="translate(-50 -40)"/>
