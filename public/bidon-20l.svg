      <stop offset="0"   stop-color="#0a2a44"/>
      <stop offset=".18" stop-color="#1d6ea8"/>
      <stop offset=".42" stop-color="#59c8f5"/>
      <stop offset=".62" stop-color="#2b93cf"/>
      <stop offset="1"   stop-color="#082238"/>
    </linearGradient>
    <linearGradient id="vf-water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#0d3a5c" stop-opacity=".9"/>
      <stop offset=".4"  stop-color="#7ad8ff" stop-opacity=".55"/>
      <stop offset="1"   stop-color="#0d3a5c" stop-opacity=".9"/>
    </linearGradient>
    <clipPath id="vf-clip">
      <path d="M46 108c0-12 7-17 17-21 10-4 12-7 12-13v-6h50v6c0 6 2 9 12 13 10 4 17 9 17 21v138c0 13-9 22-22 22H68c-13 0-22-9-22-22z"/>
    </clipPath>
  </defs>

  <!-- cuerpo -->
  <path d="M46 108c0-12 7-17 17-21 10-4 12-7 12-13v-6h50v6c0 6 2 9 12 13 10 4 17 9 17 21v138c0 13-9 22-22 22H68c-13 0-22-9-22-22z" fill="url(#vf-body)"/>

  <!-- agua y estrías -->
  <g clip-path="url(#vf-clip)">
    <rect x="44" y="160" width="112" height="120" fill="url(#vf-water)"/>
    <g stroke="#bfeaff" stroke-opacity=".22" stroke-width="2">
      <path d="M46 136h108M46 148h108M46 232h108M46 244h108"/>
    </g>
    <path d="M62 116c0 58 0 96 0 150" stroke="#eaf8ff" stroke-opacity=".38" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M142 126c0 54 0 92 0 132" stroke="#eaf8ff" stroke-opacity=".14" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- contorno -->
  <path d="M46 108c0-12 7-17 17-21 10-4 12-7 12-13v-6h50v6c0 6 2 9 12 13 10 4 17 9 17 21v138c0 13-9 22-22 22H68c-13 0-22-9-22-22z" fill="none" stroke="#9fdcff" stroke-opacity=".45" stroke-width="2"/>

  <!-- asa -->
  <path d="M156 134c15 2 22 11 22 24s-7 22-22 24" fill="none" stroke="#9fdcff" stroke-opacity=".55" stroke-width="6" stroke-linecap="round"/>

  <!-- cuello y tapa con sello -->
  <rect x="82" y="52" width="36" height="16" rx="3" fill="#1e7fc0"/>
  <rect x="78" y="32" width="44" height="22" rx="5" fill="#0a9de0"/>
  <rect x="78" y="32" width="44" height="22" rx="5" fill="none" stroke="#bfeaff" stroke-opacity=".5" stroke-width="1.6"/>
  <g stroke="#eaf8ff" stroke-opacity=".55" stroke-width="1.3">
    <path d="M86 32v22M94 32v22M102 32v22M110 32v22M118 32v22"/>
